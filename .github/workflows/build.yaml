name: Build

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 26
          cache: maven

      - name: Setup Maven settings.xml
        run: |
          mkdir -p ~/.m2
          cat <<EOF > ~/.m2/settings.xml
          <settings>
            <servers>

              <server>
                <id>github-bom</id>
                <username>${GITHUB_ACTOR}</username>
                <password>${GH_PACKAGES_READ_TOKEN}</password>
              </server>
          
              <server>
                <id>github-commons</id>
                <username>${GITHUB_ACTOR}</username>
                <password>${GH_PACKAGES_READ_TOKEN}</password>
              </server>
          
              <server>
                <id>github-context</id>
                <username>${GITHUB_ACTOR}</username>
                <password>${GH_PACKAGES_READ_TOKEN}</password>
              </server>

              <server>
                <id>github-observability</id>
                <username>${GITHUB_ACTOR}</username>
                <password>${GH_PACKAGES_READ_TOKEN}</password>
              </server>

              <server>
                <id>github-kafka</id>
                <username>${GITHUB_ACTOR}</username>
                <password>${GH_PACKAGES_READ_TOKEN}</password>
              </server>

              <server>
                <id>github-logger</id>
                <username>${GITHUB_ACTOR}</username>
                <password>${GH_PACKAGES_READ_TOKEN}</password>
              </server>
          
              <server>
                <id>github-logger</id>
                <username>${GITHUB_ACTOR}</username>
                <password>${GH_PACKAGES_READ_TOKEN}</password>
              </server>
          
              <server>
                <id>github-validation</id>
                <username>${GITHUB_ACTOR}</username>
                <password>${GH_PACKAGES_READ_TOKEN}</password>
              </server>
          
              <server>
                <id>github-cache</id>
                <username>${GITHUB_ACTOR}</username>
                <password>${GH_PACKAGES_READ_TOKEN}</password>
              </server>
          
              <server>
                <id>github-storage</id>
                <username>${GITHUB_ACTOR}</username>
                <password>${GH_PACKAGES_READ_TOKEN}</password>
              </server>

              <server>
                <id>github-publish</id>
                <username>${GITHUB_ACTOR}</username>
                <password>${GITHUB_TOKEN}</password>
              </server>

              <server>
                <id>github-starter</id>
                <username>${GITHUB_ACTOR}</username>
                <password>${GITHUB_TOKEN}</password>
              </server>

            </servers>
          </settings>
          EOF
        env:
          GH_PACKAGES_READ_TOKEN: ${{ secrets.OMNIXYS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}


      - name: Build & Test
        run: mvn -B test